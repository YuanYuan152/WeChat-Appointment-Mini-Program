# Installed as a root-owned Actions-only policy. Test database identity,
# public domains and host bind paths are literals by design; never replace
# them with environment interpolation.
services:
  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    user: "10001:10001"
    pull_policy: never
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - /bin/sh
      - -ec
      - |
        for data_dir in /data/uploads /data/assessment-data /data/assessment-assets; do
          if [ ! -d "$${data_dir}" ] || [ ! -w "$${data_dir}" ]; then
            echo "persistent data directory is missing or not writable by uid 10001: $${data_dir}" >&2
            exit 1
          fi
        done
        exec uvicorn main:app \
          --host 0.0.0.0 \
          --port 8000 \
          --workers "$${BACKEND_WORKERS:-1}" \
          --proxy-headers
    environment:
      APP_ENV: test
      APP_VERSION: "${APP_VERSION:?APP_VERSION is required}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ENABLE_API_DOCS: "true"
      AUTO_MIGRATE_SCHEMA: "false"
      ALLOW_DEV_LOGIN: "true"
      ALLOW_SIMULATED_PAYMENT: "true"
      CORS_ALLOWED_ORIGINS: "https://test.eap.ji-psy.com,https://test.admin.ji-psy.com"
      DB_SERVER: mssql
      DB_PORT: "1433"
      DB_NAME: lxxlBuild_test
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_TRUSTED_CONNECTION: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-5}"
      SKIP_LEGACY_QUERIES: "${SKIP_LEGACY_QUERIES:-true}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRATION_HOURS: "${JWT_EXPIRATION_HOURS:-168}"
      BASE_URL: https://test.eap.ji-psy.com
      UPLOAD_DIR: /data/uploads
      ASSESSMENT_DATA_DIR: /data/assessment-data
      ASSESSMENT_ASSET_DIR: /data/assessment-assets
      ASSESSMENT_SEED_DATA_DIR: /workspace/EAP_front_site/src/data
      ASSESSMENT_CONSENT_VERSION: "${ASSESSMENT_CONSENT_VERSION:-2026-01}"
      ASSESSMENT_SHARE_SECRET: "${ASSESSMENT_SHARE_SECRET:?ASSESSMENT_SHARE_SECRET is required}"
      ASSESSMENT_FRONTEND_BASE_URL: https://test.eap.ji-psy.com
      MESSAGE_INTERNAL_TOKEN: "${MESSAGE_INTERNAL_TOKEN:-}"
      WECHAT_APPID: "${WECHAT_APPID:-}"
      WECHAT_SECRET: "${WECHAT_SECRET:-}"
      WECHAT_MINIPROGRAM_STATE: trial
      # Actions test releases must never create a real merchant order even if
      # a production credential is accidentally copied into test.env.
      WECHAT_PAY_MCH_ID: ""
      WECHAT_PAY_KEY: ""
      WECHAT_PAY_NOTIFY_URL: https://test.eap.ji-psy.com/api/payment/wechat/callback
      SMS_MOCK: "true"
      SMS_PROVIDER: tencent
      SMS_CODE_LENGTH: "${SMS_CODE_LENGTH:-6}"
      SMS_CODE_TTL_MINUTES: "${SMS_CODE_TTL_MINUTES:-5}"
      SMS_RESEND_INTERVAL_SECONDS: "${SMS_RESEND_INTERVAL_SECONDS:-60}"
      SMS_MAX_SENDS_PER_HOUR: "${SMS_MAX_SENDS_PER_HOUR:-10}"
      SMS_MAX_VERIFY_ATTEMPTS: "${SMS_MAX_VERIFY_ATTEMPTS:-5}"
      SMS_CODE_HASH_SECRET: "${SMS_CODE_HASH_SECRET:-}"
    ports:
      - 127.0.0.1:18000:8000
    volumes:
      - /data/mini_program/shared/test/uploads:/data/uploads
      - /data/mini_program/shared/test/assessment-data:/data/assessment-data
      - /data/mini_program/shared/test/assessment-assets:/data/assessment-assets
    networks:
      - app
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
        tag: mini-test-backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: "${BACKEND_CPUS_LIMIT:-0.75}"
    mem_limit: "${BACKEND_MEMORY_LIMIT:-768m}"
    mem_reservation: "${BACKEND_MEMORY_RESERVATION:-256m}"
    pids_limit: "${BACKEND_PIDS_LIMIT:-256}"

  admin:
    image: "${ADMIN_IMAGE:?ADMIN_IMAGE is required}"
    user: "1000:1000"
    pull_policy: never
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      APP_VERSION: "${APP_VERSION:?APP_VERSION is required}"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - 127.0.0.1:13001:3000
    networks:
      - app
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
        tag: mini-test-admin
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/health").then(r => {
            if (!r.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: "${FRONTEND_CPUS_LIMIT:-0.50}"
    mem_limit: "${FRONTEND_MEMORY_LIMIT:-512m}"
    mem_reservation: "${FRONTEND_MEMORY_RESERVATION:-128m}"
    pids_limit: "${FRONTEND_PIDS_LIMIT:-192}"

  eap:
    image: "${EAP_IMAGE:?EAP_IMAGE is required}"
    user: "1000:1000"
    pull_policy: never
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      APP_VERSION: "${APP_VERSION:?APP_VERSION is required}"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: https://test.eap.ji-psy.com
      NEXT_PUBLIC_SITE_URL: https://test.eap.ji-psy.com
      NEXT_PUBLIC_DATA_SOURCE: mock
    ports:
      - 127.0.0.1:13000:3000
    networks:
      - app
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
        tag: mini-test-eap
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/health").then(r => {
            if (!r.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: "${FRONTEND_CPUS_LIMIT:-0.50}"
    mem_limit: "${FRONTEND_MEMORY_LIMIT:-512m}"
    mem_reservation: "${FRONTEND_MEMORY_RESERVATION:-128m}"
    pids_limit: "${FRONTEND_PIDS_LIMIT:-192}"

networks:
  app:
    external: true
    name: mini-test_app
