name: mini-test

x-test-syslog: &test-syslog
  driver: syslog
  options:
    syslog-address: "${SYSLOG_ADDRESS:-unixgram:///dev/log}"

x-test-mssql-resources: &test-mssql-resources
  cpus: "${MSSQL_CPUS_LIMIT:-1.50}"
  mem_limit: "${MSSQL_MEMORY_LIMIT:-2g}"
  mem_reservation: "${MSSQL_MEMORY_RESERVATION:-1g}"
  pids_limit: "${MSSQL_PIDS_LIMIT:-512}"

x-test-job-resources: &test-job-resources
  cpus: "${DATABASE_JOB_CPUS_LIMIT:-0.75}"
  mem_limit: "${DATABASE_JOB_MEMORY_LIMIT:-768m}"
  mem_reservation: "${DATABASE_JOB_MEMORY_RESERVATION:-128m}"
  pids_limit: "${DATABASE_JOB_PIDS_LIMIT:-192}"

x-test-backend-resources: &test-backend-resources
  cpus: "${BACKEND_CPUS_LIMIT:-0.75}"
  mem_limit: "${BACKEND_MEMORY_LIMIT:-768m}"
  mem_reservation: "${BACKEND_MEMORY_RESERVATION:-256m}"
  pids_limit: "${BACKEND_PIDS_LIMIT:-256}"

x-test-frontend-resources: &test-frontend-resources
  cpus: "${FRONTEND_CPUS_LIMIT:-0.50}"
  mem_limit: "${FRONTEND_MEMORY_LIMIT:-512m}"
  mem_reservation: "${FRONTEND_MEMORY_RESERVATION:-128m}"
  pids_limit: "${FRONTEND_PIDS_LIMIT:-192}"

services:
  mssql:
    <<: *test-mssql-resources
    volumes:
      - "${MSSQL_BACKUP_HOST_DIR:-/data/mini_program/backups/test}:/var/opt/mssql/backup"
    logging:
      <<: *test-syslog
      options:
        syslog-address: "${SYSLOG_ADDRESS:-unixgram:///dev/log}"
        tag: mini-test-mssql

  db-init:
    <<: *test-job-resources
    logging:
      <<: *test-syslog
      options:
        syslog-address: "${SYSLOG_ADDRESS:-unixgram:///dev/log}"
        tag: mini-test-db-init

  migrate:
    <<: *test-job-resources
    volumes:
      - "${UPLOAD_HOST_DIR:-/data/mini_program/shared/test/uploads}:/data/uploads"
      - "${ASSESSMENT_DATA_HOST_DIR:-/data/mini_program/shared/test/assessment-data}:/data/assessment-data"
      - "${ASSESSMENT_ASSET_HOST_DIR:-/data/mini_program/shared/test/assessment-assets}:/data/assessment-assets"
    logging:
      <<: *test-syslog
      options:
        syslog-address: "${SYSLOG_ADDRESS:-unixgram:///dev/log}"
        tag: mini-test-migrate

  backend:
    <<: *test-backend-resources
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - "${UPLOAD_HOST_DIR:-/data/mini_program/shared/test/uploads}:/data/uploads"
      - "${ASSESSMENT_DATA_HOST_DIR:-/data/mini_program/shared/test/assessment-data}:/data/assessment-data"
      - "${ASSESSMENT_ASSET_HOST_DIR:-/data/mini_program/shared/test/assessment-assets}:/data/assessment-assets"
    logging:
      <<: *test-syslog
      options:
        syslog-address: "${SYSLOG_ADDRESS:-unixgram:///dev/log}"
        tag: mini-test-backend

  admin:
    <<: *test-frontend-resources
    ports:
      - "127.0.0.1:13001:3000"
    logging:
      <<: *test-syslog
      options:
        syslog-address: "${SYSLOG_ADDRESS:-unixgram:///dev/log}"
        tag: mini-test-admin

  eap:
    <<: *test-frontend-resources
    ports:
      - "127.0.0.1:13000:3000"
    logging:
      <<: *test-syslog
      options:
        syslog-address: "${SYSLOG_ADDRESS:-unixgram:///dev/log}"
        tag: mini-test-eap
