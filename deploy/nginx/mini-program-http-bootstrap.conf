# Initial HTTP-only configuration used solely while obtaining certificates.
# Install this file only after reviewing the four domains and ACME webroot.

server_tokens off;

log_format mini_bootstrap_access escape=json
    '{"timestamp":"$time_iso8601",'
    '"remote_addr":"$mini_bootstrap_safe_remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$mini_bootstrap_safe_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time}';

map $remote_addr $mini_bootstrap_safe_remote_addr {
    "~^(?<mini_bootstrap_ipv4_prefix>[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}$" "$mini_bootstrap_ipv4_prefix.0";
    default "[redacted]";
}

map $uri $mini_bootstrap_safe_uri {
    default $uri;
    ~^/api/web/assessment-shares/[^/]+/scan/?$ "/api/web/assessment-shares/[redacted]/scan";
    ~^/static/uploads/[^/]+(?:/|$) "/static/uploads/[redacted]";
    ~^/static/assessment-assets/[^/]+(?:/|$) "/static/assessment-assets/[redacted]";
    ~"(^|/)[0-9]+(/|$)" "[redacted-id-path]";
    ~"(?i)(^|/)[0-9a-f][0-9a-f-]*-[0-9a-f-]+(/|$)" "[redacted-id-path]";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /data/mini_program/logs/system/nginx/bootstrap-unknown-host.access.log mini_bootstrap_access;
    error_log /data/mini_program/logs/system/nginx/bootstrap-unknown-host.error.log warn;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name eap.ji-psy.com admin.ji-psy.com;
    access_log /data/mini_program/logs/production/nginx/bootstrap.access.log mini_bootstrap_access;
    error_log /data/mini_program/logs/production/nginx/bootstrap.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name test.eap.ji-psy.com test.admin.ji-psy.com;
    access_log /data/mini_program/logs/test/nginx/bootstrap.access.log mini_bootstrap_access;
    error_log /data/mini_program/logs/test/nginx/bootstrap.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
