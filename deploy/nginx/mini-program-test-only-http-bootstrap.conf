# Transitional HTTP-only vhost for adding the isolated test environment beside
# the server's existing production/legacy vhosts.
#
# Enable this file only while obtaining the test SAN certificate, then replace
# it with mini-program-test-only.conf. It intentionally declares no
# default_server, production hostname, production upstream, or global
# server_tokens directive, so ownership of existing production traffic remains
# unchanged.

log_format mini_test_only_bootstrap_access escape=json
    '{"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$mini_test_only_bootstrap_safe_remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$mini_test_only_bootstrap_safe_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time}';

map $remote_addr $mini_test_only_bootstrap_safe_remote_addr {
    "~^(?<mini_test_only_bootstrap_ipv4_prefix>[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}$" "$mini_test_only_bootstrap_ipv4_prefix.0";
    default "[redacted]";
}

map $uri $mini_test_only_bootstrap_safe_uri {
    default $uri;
    ~^/api/web/assessment-shares/[^/]+/scan/?$ "/api/web/assessment-shares/[redacted]/scan";
    ~^/static/uploads/[^/]+(?:/|$) "/static/uploads/[redacted]";
    ~^/static/assessment-assets/[^/]+(?:/|$) "/static/assessment-assets/[redacted]";
    ~"(^|/)[0-9]+(/|$)" "[redacted-id-path]";
    ~"(?i)(^|/)[0-9a-f][0-9a-f-]*-[0-9a-f-]+(/|$)" "[redacted-id-path]";
}

server {
    listen 80;
    listen [::]:80;
    server_name test.eap.ji-psy.com test.admin.ji-psy.com;
    server_tokens off;

    access_log /data/mini_program/logs/test/nginx/bootstrap.access.log mini_test_only_bootstrap_access;
    error_log /data/mini_program/logs/test/nginx/bootstrap.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
