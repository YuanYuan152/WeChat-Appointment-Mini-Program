# Test-only reverse proxy for installing the Docker test environment beside the
# server's existing production/legacy vhosts.
#
# This file owns only:
#   test.eap.ji-psy.com   -> EAP 127.0.0.1:13000, API 127.0.0.1:18000
#   test.admin.ji-psy.com -> Admin 127.0.0.1:13001, API 127.0.0.1:18000
#
# It intentionally declares no default_server, production hostname, production
# upstream, or global server_tokens directive. The shared certificate must have
# both test hostnames in its SAN extension.

log_format mini_test_only_access escape=json
    '{"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$mini_test_only_safe_remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$mini_test_only_safe_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time"}';

map $remote_addr $mini_test_only_safe_remote_addr {
    "~^(?<mini_test_only_ipv4_prefix>[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}$" "$mini_test_only_ipv4_prefix.0";
    default "[redacted]";
}

map $uri $mini_test_only_safe_uri {
    default $uri;
    ~^/api/web/assessment-shares/[^/]+/scan/?$ "/api/web/assessment-shares/[redacted]/scan";
    ~^/static/uploads/[^/]+(?:/|$) "/static/uploads/[redacted]";
    ~^/static/assessment-assets/[^/]+(?:/|$) "/static/assessment-assets/[redacted]";
    ~"(^|/)[0-9]+(/|$)" "[redacted-id-path]";
    ~"(?i)(^|/)[0-9a-f][0-9a-f-]*-[0-9a-f-]+(/|$)" "[redacted-id-path]";
}

upstream mini_test_only_eap {
    server 127.0.0.1:13000;
    keepalive 16;
}

upstream mini_test_only_admin {
    server 127.0.0.1:13001;
    keepalive 16;
}

upstream mini_test_only_api {
    server 127.0.0.1:18000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.eap.ji-psy.com test.admin.ji-psy.com;
    server_tokens off;

    access_log /data/mini_program/logs/test/nginx/http-redirect.access.log mini_test_only_access;
    error_log /data/mini_program/logs/test/nginx/http-redirect.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.eap.ji-psy.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/test.eap.ji-psy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.eap.ji-psy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    access_log /data/mini_program/logs/test/nginx/eap.access.log mini_test_only_access;
    error_log /data/mini_program/logs/test/nginx/eap.error.log warn;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; frame-src 'self' https:;" always;

    location = /healthz {
        access_log off;
        proxy_pass http://mini_test_only_api/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        access_log /data/mini_program/logs/test/nginx/api.access.log mini_test_only_access;
        proxy_pass http://mini_test_only_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        access_log /data/mini_program/logs/test/nginx/api.access.log mini_test_only_access;
        proxy_pass http://mini_test_only_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://mini_test_only_eap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

