# Four-domain reverse proxy for isolated test and production stacks.
#
# Expected loopback listeners:
#   production: EAP 23000, Admin 23001, API 28000
#   test:       EAP 13000, Admin 13001, API 18000
#
# The default HTTP/HTTPS servers deliberately reject IP and unknown-host traffic.

server_tokens off;

log_format mini_access escape=json
    '{"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$mini_safe_remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$mini_safe_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time"}';

# Keep an IPv4 /24 for coarse abuse and availability analysis. IPv6 and
# non-address values are redacted because a stable full address is personal
# data and is not needed in routine application logs.
map $remote_addr $mini_safe_remote_addr {
    "~^(?<mini_ipv4_prefix>[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}$" "$mini_ipv4_prefix.0";
    default "[redacted]";
}

# Keep request status/timing observability without persisting identifiers that
# are carried in path segments. Query strings are already excluded by using
# $uri rather than $request_uri.
map $uri $mini_safe_uri {
    default $uri;
    ~^/api/web/assessment-shares/[^/]+/scan/?$ "/api/web/assessment-shares/[redacted]/scan";
    ~^/static/uploads/[^/]+(?:/|$) "/static/uploads/[redacted]";
    ~^/static/assessment-assets/[^/]+(?:/|$) "/static/assessment-assets/[redacted]";
    ~"(^|/)[0-9]+(/|$)" "[redacted-id-path]";
    ~"(?i)(^|/)[0-9a-f][0-9a-f-]*-[0-9a-f-]+(/|$)" "[redacted-id-path]";
}

upstream mini_production_eap {
    server 127.0.0.1:23000;
    keepalive 16;
}

upstream mini_production_admin {
    server 127.0.0.1:23001;
    keepalive 16;
}

upstream mini_production_api {
    server 127.0.0.1:28000;
    keepalive 32;
}

upstream mini_test_eap {
    server 127.0.0.1:13000;
    keepalive 16;
}

upstream mini_test_admin {
    server 127.0.0.1:13001;
    keepalive 16;
}

upstream mini_test_api {
    server 127.0.0.1:18000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /data/mini_program/logs/system/nginx/unknown-host.access.log mini_access;
    error_log /data/mini_program/logs/system/nginx/unknown-host.error.log warn;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name eap.ji-psy.com admin.ji-psy.com;
    access_log /data/mini_program/logs/production/nginx/http-redirect.access.log mini_access;
    error_log /data/mini_program/logs/production/nginx/http-redirect.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name test.eap.ji-psy.com test.admin.ji-psy.com;
    access_log /data/mini_program/logs/test/nginx/http-redirect.access.log mini_access;
    error_log /data/mini_program/logs/test/nginx/http-redirect.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Reject unknown SNI and direct-IP TLS traffic instead of serving EAP.
# A valid certificate is still required for the TLS handshake; the request is
# rejected immediately after it. Do not use this certificate for host routing.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/eap.ji-psy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eap.ji-psy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /data/mini_program/logs/system/nginx/unknown-host.access.log mini_access;
    error_log /data/mini_program/logs/system/nginx/unknown-host.error.log warn;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eap.ji-psy.com;

    ssl_certificate /etc/letsencrypt/live/eap.ji-psy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eap.ji-psy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    access_log /data/mini_program/logs/production/nginx/eap.access.log mini_access;
    error_log /data/mini_program/logs/production/nginx/eap.error.log warn;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; frame-src 'self' https:;" always;

    location = /healthz {
        access_log off;
        proxy_pass http://mini_production_api/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        access_log /data/mini_program/logs/production/nginx/api.access.log mini_access;
        proxy_pass http://mini_production_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        access_log /data/mini_program/logs/production/nginx/api.access.log mini_access;
        proxy_pass http://mini_production_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://mini_production_eap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

