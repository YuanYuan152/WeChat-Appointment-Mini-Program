# Route Docker/application syslog tags into environment- and service-specific
# files. Compose logging tags must exactly match the program names below.

template(
    name="MiniProgramApplicationLine"
    type="string"
    string="%timegenerated:::date-rfc3339% %hostname% %syslogtag%%msg%\n"
)

if $programname == "mini-test-backend" then {
    action(
        name="mini_test_backend_file"
        type="omfile"
        file="/data/mini_program/logs/test/backend/application.log"
        template="MiniProgramApplicationLine"
        dirCreateMode="0750"
        fileCreateMode="0640"
        fileOwner="syslog"
        fileGroup="adm"
    )
    stop
}

